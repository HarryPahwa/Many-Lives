[project]
name = "many-lives"
version = "0.1.0"
description = "Agentic Dungeon Harness — a persistent-world agent harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "starlette==0.46.2",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: browser tests driven by Playwright (need `playwright install chromium`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
